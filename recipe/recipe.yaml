context:
  name: dynamixel-sdk
  version: "4.0.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ROBOTIS-GIT/DynamixelSDK/archive/refs/tags/${{ version }}.tar.gz
  sha256: 26186f26f25219e332c7d43ef532b0670a6d0f68f77d00d9c11dd4a604497d4d

build:
  script: python -m pip install ./python -vv
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - pyserial

tests:
  - python:
      imports:
        - dynamixel_sdk
      pip_check: true
      python_version:
        - ${{ python_min }}.*

about:
  homepage: https://github.com/ROBOTIS-GIT/DynamixelSDK
  summary: 'ROBOTIS Dynamixel SDK (Protocol1.0/2.0).'
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - traversaro
